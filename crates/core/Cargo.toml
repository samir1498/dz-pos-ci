[package]
name = "dzpos-core"
version.workspace = true
edition.workspace = true

[dependencies]
diesel = { workspace = true, features = ["sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.2"
# bundled: one binary, no system sqlite on the shop's Windows PC
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
# The audit log stores the row before and after as JSON text (features.md §5).
serde_json = { workspace = true }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# proptest for the money invariants; the fixtures are read with serde_json,
# which is a normal dependency above.
proptest = "1.11"

[lints]
workspace = true
