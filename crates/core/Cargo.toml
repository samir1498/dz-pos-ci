[package]
name = "dzpos-core"
version.workspace = true
edition.workspace = true

[dependencies]
# The kernel crate split (S3 of
# `a-kernel-crate-and-retail-as-the-first-module`): this crate is now a thin
# re-export facade over the two so `dzpos_core::services::x`,
# `dzpos_core::models::x` and the rest keep resolving for `crates/api`, the
# Tauri app and this crate's own 59 test files without every one of them
# being rewritten in the same change that moved the source.
dzpos-kernel = { path = "../kernel" }
# Optional since S5: `crates/api` builds without a shop behind
# `--no-default-features`, which forwards through this crate's own `retail`
# feature rather than a direct dependency of its own, so this facade is the
# one place that decides whether the shop half of the workspace compiles at
# all.
dzpos-retail = { path = "../retail", optional = true }

# `64-column-tables`: `documents` passed 32 columns when the buyer block and
# the balance triple landed (migration 4), and diesel's default table macro
# stops there. This crate's tests query the database directly (39 files
# under `tests/`), so it keeps the same diesel feature set the kernel and
# retail crates build `schema.rs` against.
diesel = { workspace = true, features = [
    "sqlite",
    "chrono",
    "returning_clauses_for_sqlite_3_35",
    "64-column-tables",
] }
diesel_migrations = "2.2"
# bundled: one binary, no system sqlite on the shop's Windows PC
libsqlite3-sys = { version = "0.37", features = ["bundled"] }
chrono = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
# The audit log stores the row before and after as JSON text (features.md §5).
serde_json = { workspace = true }
thiserror = "2"
# argon2id for the PIN and the password (features.md §5). Version and
# features are pinned at the workspace level.
argon2 = { workspace = true }
# SHA-256 of a session token (services::sessions says why it is not argon2id:
# 256 bits of OS randomness needs no slow hash, and a salted string cannot be
# looked up by). Pure Rust, from the same RustCrypto tree argon2 comes from,
# and already in the lock through it, so it compiles nothing new.
sha2 = "0.10.9"
# Printed templates (features.md §4). Compiled into the binary, checked at
# compile time and HTML-escaped by default, so a shop name with an "&" in it
# cannot break a ticket and no template file ships beside the app.
askama = { version = "0.16.1", default-features = false, features = ["std", "derive"] }
# The Excel half of features.md §1 (export four workbooks, import products
# from a template). Both are pure Rust and neither pulls a C library in:
# `rust_xlsxwriter`'s zip backend is the Rust `zip` crate unless the `zlib`
# feature is on, and it is not. Versions checked on crates.io 2026-09-10.
# `chrono` on the writer is what lets a date leave as a date rather than as
# a string a spreadsheet cannot sort.
rust_xlsxwriter = { version = "0.99.0", features = ["chrono"] }
# `dates` so a cell a person typed as a date reads back as one; used by the
# product import and by the tests that read a written workbook's cells.
calamine = { version = "0.36.1", features = ["dates"] }
# EAN-13 bars as SVG for the barcode label. Its only dependency, `image`, is
# optional and off in the default features (ascii, json, svg, std), so this
# adds no native code either.
barcoders = "2.0.0"
# The support bundle's zip (M5 T3). Already in the lock at 8.6.0 through
# `rust_xlsxwriter`'s own zip backend (an .xlsx is a zip), so this compiles
# nothing new; `default-features = false` plus `deflate` is the same feature
# set that dependency already activates (no bzip2, zstd or lzma in the lock,
# both of which need a C toolchain the bundled sqlite already avoids).
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# The Arabic ticket as a raster (plans/arabic-on-a-cheap-thermal-head). A
# cheap head has no single-byte table for Arabic, so the ticket is drawn and
# sent as dots; drawing it needs the three jobs the plan's table compares.
# All three are pure Rust, none looks at a system font, and both of the new
# ones sit on the same `ttf-parser`, so the Windows release target needs no
# toolchain change. Versions pinned exact (checked on crates.io 2026-09-21).
#
# The shaper: which glyph each Arabic letter takes given its neighbours.
# HarfBuzz ported to Rust; `cosmic-text` was the alternative and brings a
# system font database and a second rasteriser we would configure to do
# nothing (the plan says why).
rustybuzz = "=0.20.1"
ab_glyph = "=0.2.32"
# The machine's IANA time zone name for the support bundle (M5 T3). Already
# in the lock at 0.1.65, pulled in transitively; this makes it a direct
# dependency of the one caller that reads it rather than compiling a second
# copy at a different version.
iana-time-zone = "0.1"
# The bidi algorithm: which runs of a ticket line go right to left. It was a
# dev-dependency while only the print goldens ran it; the raster ticket runs
# it on the way to paper, because an Arabic line carrying Western digits and
# an amount is exactly the mixed paragraph the algorithm exists for. Same
# version the tests already pinned, and the implementation `rust-url` uses.
unicode-bidi = "=0.3.18"

[features]
default = ["retail"]
retail = ["dep:dzpos-retail"]

[dev-dependencies]
tempfile = "3"
# proptest for the money invariants; the fixtures are read with serde_json,
# which is a normal dependency above.
proptest = "1.11"

[lints]
workspace = true
