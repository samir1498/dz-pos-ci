[package]
name = "dzpos-api"
version.workspace = true
edition.workspace = true

[dependencies]
# `default-features = false`: this crate's own `retail` feature is what
# turns `dzpos-core`'s back on (S5 of
# `a-kernel-crate-and-retail-as-the-first-module`). A plain path dependency
# here would let any other workspace member that still asks for
# `dzpos-core`'s default features re-unify retail back in even for a
# `--no-default-features` build of this crate alone (cargo unifies a
# dependency's features across every crate that asks for it in the same
# build), so `check-no-retail` builds this crate on its own, never
# `--workspace`.
dzpos-core = { path = "../core", default-features = false }
# Versions checked on crates.io 2026-09-08; these are the current stable
# releases and the candidates docs/architecture.md already named.
axum = "0.8.9"
# "time": the daily backup task sleeps between checks.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.7.1", features = ["cors"] }
clap = { version = "4.6.6", features = ["derive"] }
ts-rs = "12.0.1"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
# The launch token is 32 random bytes from the OS; already in the lock
# through tauri, so no new crate is compiled.
getrandom = "0.3.4"
# Days on the wire (a régime change is dated); the core already uses it.
chrono = { workspace = true }
# M6 T1: mDNS for LAN discovery (phone finds desktop on same Wi-Fi).
# mdns-sd is the maintained Bonjour/mDNS crate (Avahi compatible).
mdns-sd = "0.11"

# S5 of `a-kernel-crate-and-retail-as-the-first-module`: the shop behind a
# switch. On (the default), a build is today's product unchanged: every
# retail route, gate row and DTO in this crate compiles and `just gates`
# proves nothing moved. Off, `check-no-retail` (justfile) proves this crate
# alone still compiles and clippy-clean with no shop in it; the full build
# that opens a database and signs a user in without one is S7.
[features]
default = ["retail"]
retail = ["dzpos-core/retail"]
clinic = ["dzpos-core/clinic"]

[dev-dependencies]
# Test-only: one test plants a row the migration's CHECK refuses, which no
# service can write. Shipped code in this crate goes through dzpos-core.
diesel = { workspace = true, features = ["sqlite"] }
# Test-only: the previous-version open test builds a shop file with every
# migration but the last, which needs the migrator itself. Already in the
# lock through dzpos-core, so nothing new compiles.
diesel_migrations = "2.2"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
# Test-only: `tests/support_bundle.rs` unzips the bundle the route answers
# with to walk its entries. Already in the lock through dzpos-core's own
# `zip` dependency (M5 T3), so this compiles nothing new.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# Test-only: the error-mapping regression test constructs a real
# `CoreError::Hash` to pin its status and code. Already in the lock through
# dzpos-kernel's own dependency, so this compiles nothing new.
argon2 = { workspace = true }
# Test-only: the same regression test constructs a real
# `RetailError::Workbook` to pin its status and code. Already in the lock
# through dzpos-retail's own dependency, so this compiles nothing new.
rust_xlsxwriter = "0.99.0"

[lints]
workspace = true
