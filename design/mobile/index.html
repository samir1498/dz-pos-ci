<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dz-pos — mobile mockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/components.css" />
    <style>
      body {
        background: var(--p-stone-200);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: var(--space-6);
      }

      .phone {
        position: relative;
        width: 390px;
        height: 844px;
        background: var(--surface-bg);
        border-radius: 44px;
        box-shadow:
          0 0 0 10px var(--p-stone-900),
          var(--shadow-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--space-3) var(--space-5) var(--space-1);
        font-size: var(--text-sm);
        font-weight: 600;
      }

      .statusbar .chip {
        font-size: var(--text-xs);
        font-weight: 500;
        padding: 2px var(--space-2);
        border-radius: var(--radius-full);
        background: var(--surface-raised);
        color: var(--text-secondary);
      }

      .statusbar .chip.is-on {
        background: var(--color-primary-soft);
        color: var(--text-success);
      }

      .screen {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .appbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-2);
        padding: var(--space-2) var(--space-4);
      }

      .appbar h1 {
        font-size: var(--text-xl);
        font-weight: 600;
      }

      .langs {
        display: inline-flex;
        gap: 2px;
        padding: 2px;
        background: var(--surface-raised);
        border-radius: var(--radius-full);
      }

      .langs button {
        min-width: 36px;
        min-height: 28px;
        padding-inline: var(--space-2);
        border-radius: var(--radius-full);
        font-size: var(--text-xs);
        color: var(--text-secondary);
      }

      .langs button.is-active {
        background: var(--surface-card);
        color: var(--text-primary);
        box-shadow: var(--shadow-sm);
      }

      .body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 0 var(--space-4) var(--space-4);
        display: grid;
        align-content: start;
        gap: var(--space-3);
      }

      .tabbar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border-block-start: 1px solid var(--border-default);
        background: var(--surface-card);
        padding-block: var(--space-1) var(--space-4);
      }

      .tabbar button {
        min-height: var(--touch-min);
        display: grid;
        justify-items: center;
        gap: 2px;
        font-size: var(--text-xs);
        color: var(--text-secondary);
      }

      .tabbar button .ico {
        font-size: 20px;
        line-height: 1;
      }

      .tabbar button.is-active {
        color: var(--color-primary);
        font-weight: 600;
      }

      .searchrow {
        display: flex;
        gap: var(--space-2);
      }

      .chips {
        display: flex;
        gap: var(--space-2);
        overflow-x: auto;
        padding-block: 2px;
        scrollbar-width: none;
      }

      .chips button {
        flex: 0 0 auto;
        min-height: 34px;
        padding-inline: var(--space-3);
        border-radius: var(--radius-full);
        background: var(--surface-card);
        border: 1px solid var(--border-default);
        font-size: var(--text-sm);
        color: var(--text-secondary);
      }

      .chips button.is-active {
        background: var(--color-primary);
        border-color: var(--color-primary);
        color: var(--color-on-primary);
      }

      .list {
        display: grid;
        gap: var(--space-2);
      }

      .row {
        display: flex;
        align-items: center;
        gap: var(--space-3);
        min-height: 60px;
        padding: var(--space-3);
        background: var(--surface-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
        text-align: start;
        width: 100%;
      }

      .row:active {
        background: var(--surface-hover);
      }

      .row .main {
        flex: 1;
        min-width: 0;
        display: grid;
        gap: 2px;
      }

      .row .title {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row .price {
        font-weight: 600;
      }

      .stickybar {
        position: absolute;
        inset-inline: var(--space-4);
        inset-block-end: var(--space-3);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding: var(--space-3) var(--space-4);
        background: var(--surface-inverse);
        color: var(--text-on-inverse);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-lg);
      }

      .stickybar .btn {
        min-height: 36px;
      }

      .cartline {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: var(--space-2);
        padding: var(--space-3);
        background: var(--surface-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
      }

      .stepper {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
      }

      .stepper button {
        width: var(--touch-min);
        height: var(--touch-min);
        border-radius: var(--radius-md);
        background: var(--surface-raised);
        font-size: var(--text-lg);
        font-weight: 600;
      }

      .stepper .q {
        min-width: 28px;
        text-align: center;
        font-weight: 600;
      }

      .stepper .rm {
        color: var(--text-danger);
        background: var(--color-danger-soft);
      }

      .bigamount {
        text-align: center;
        font-size: var(--text-3xl);
        font-weight: 600;
        padding: var(--space-3);
        background: var(--surface-card);
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md);
      }

      .quick {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-2);
      }

      .qr {
        aspect-ratio: 1;
        width: 220px;
        margin: var(--space-6) auto;
        border: 3px dashed var(--border-strong);
        border-radius: var(--radius-lg);
        display: grid;
        place-items: center;
        color: var(--text-tertiary);
        font-size: 64px;
      }

      .pairinfo {
        text-align: center;
        font-weight: 600;
        color: var(--text-success);
      }

      .sheet-scrim {
        position: absolute;
        inset: 0;
        background: var(--surface-scrim);
        display: flex;
        align-items: flex-end;
        z-index: 40;
      }

      .sheet {
        width: 100%;
        max-height: 70%;
        overflow-y: auto;
        background: var(--surface-card);
        border-start-start-radius: var(--radius-lg);
        border-start-end-radius: var(--radius-lg);
        padding: var(--space-4) var(--space-4) var(--space-8);
        display: grid;
        gap: var(--space-3);
      }

      .sheet .handle {
        width: 40px;
        height: 4px;
        border-radius: var(--radius-full);
        background: var(--border-strong);
        margin: 0 auto;
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: var(--space-3);
        padding-block: var(--space-2);
        border-block-end: 1px solid var(--border-default);
      }

      .ticketwrap {
        background: var(--p-stone-200);
        padding: var(--space-3);
        border-radius: var(--radius-md);
        overflow-x: auto;
      }

      .toast {
        position: absolute;
      }

      .static-note {
        inset-block-start: 52px;
      }

      @media (max-width: 480px) {
        body {
          padding: 0;
          display: block;
        }

        .phone {
          width: 100%;
          height: 100vh;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="phone" id="phone">
      <div class="statusbar">
        <span class="num">09:41</span>
        <span class="chip" id="conn-chip">—</span>
      </div>
      <div class="screen" id="screen"></div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
