sonar.projectKey=dz-pos
sonar.projectName=Dinar
sonar.sources=crates,apps,packages
sonar.tests=crates,apps,packages
sonar.test.inclusions=**/*test*,**/*_test.rs,**/tests/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/.cargo-target/**,**/.claude/**,**/coverage*/**,design/**,apps/desktop/e2e/screenshots/**
sonar.coverage.exclusions=**/*test*,**/tests/**,apps/desktop/e2e/**,**/*.config.*,**/generated/**
sonar.cpd.exclusions=**/*test*,**/tests/**,apps/desktop/e2e/**
sonar.rust.lcov.reportPaths=lcov.info
sonar.javascript.lcov.reportPaths=apps/desktop/coverage/lcov.info,packages/shared/coverage/lcov.info,packages/design/coverage/lcov.info,apps/landing/coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/desktop/tsconfig.json,apps/landing/tsconfig.json,packages/shared/tsconfig.json,packages/design/tsconfig.json
sonar.rust.cargo.manifestPaths=Cargo.toml
