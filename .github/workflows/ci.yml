name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
          libgtk-3-dev
          libxcb1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Linux only: on Windows autocrlf rewrites the generated files and the
      # diff would fail on line endings rather than on a stale type.
      - name: Generated TS types are current
        if: runner.os == 'Linux'
        run: |
          cargo test -p dzpos-api --test export_bindings
          git diff --exit-code packages/shared/src/generated
      - name: Coverage (lcov for Sonar)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rust-lcov
          path: lcov.info

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
