name: CI

# Compiles, clippy, cargo test, pnpm test, pnpm build, Windows and coverage
# run on the machine (`just gates`). This file is the leftover that is cheap
# and still worth a second pair of eyes after a merge: rustfmt, the desktop
# eslint, and the release-gate script.
#
# The organisation's Actions budget is capped (jobs on Dinar-dz refuse to
# start). The same file lives on the personal mirror `samir1498/dz-pos-ci`,
# and jobs only run there, on Samir's minutes. Pull requests are not a CI
# event. After a merge to main, `just ci` copies the branch to the mirror
# and watches this run. Nothing here names a path inside the repo except
# the three commands below.
on:
  push:
    branches: [main]
    paths-ignore: ["context/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  light:
    if: github.repository == 'samir1498/dz-pos-ci'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm --filter dzpos-desktop lint
      - run: .github/scripts/release-gate.test.sh
