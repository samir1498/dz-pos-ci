name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      # A Linux-only step must not cancel the Windows tests halfway.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
          libgtk-3-dev
          libxcb1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          patchelf
      - name: Free runner disk before the cache comes back
        if: runner.os == 'Linux'
        # The cached target dir alone no longer fits beside the preinstalled
        # SDKs: the cache restore itself died with "No space left on device"
        # (runs 34378092019, 34378978920). The SDKs below are unused here
        # and weigh about 30 GB, so they go before anything is restored.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Linux only: on Windows autocrlf rewrites the generated files and the
      # diff would fail on line endings rather than on a stale type. The
      # workspace test above writes its bindings under target/, never into
      # the committed dir, so this diff sees the commit as it was pushed.
      - name: Generated TS types are current
        if: runner.os == 'Linux'
        run: |
          tmp="$(mktemp -d)"
          DZPOS_TS_OUT_DIR="$tmp" cargo test -p dzpos-api --test export_bindings
          # Both directions: a new DTO shows as "Only in $tmp", one that was
          # deleted leaves an orphan the old `git diff` never looked for.
          diff -r "$tmp" packages/shared/src/generated
      - name: Coverage (lcov for Sonar)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-llvm-cov --locked
          # Only the crates with tests. The Tauri crate has none and a
          # second instrumented build of it filled the runner's disk.
          # Its own target dir, outside the one rust-cache saves: the
          # instrumented build is rebuilt every run anyway and was the bulk
          # of a cache that stopped fitting on the runner.
          CARGO_TARGET_DIR=/tmp/llvm-cov-target cargo llvm-cov -p dzpos-core -p dzpos-api --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rust-lcov
          path: lcov.info

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
