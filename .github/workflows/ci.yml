name: CI

# Full gates: clippy, cargo test, generated types, pnpm test and build,
# Windows on main, coverage on main. Runs only on the public personal
# mirror `samir1498/dz-pos-ci` (Actions are free there). Dinar-dz is
# capped, so every job is skipped on the org and never asks for a runner.
#
# Restricted (fmt, eslint, release-gate) is a separate workflow. This one
# is the long one: push to main, or `just ci <branch> full`.
on:
  push:
    branches: [main]
    paths-ignore: ["context/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the windows job, for a branch that changes Windows-only code"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  rust:
    if: github.repository == 'samir1498/dz-pos-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
          libgtk-3-dev
          libxcb1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          patchelf
      - name: Free runner disk before the cache comes back
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dzpos-desktop build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Generated TS types are current
        run: |
          tmp="$(mktemp -d)"
          DZPOS_TS_OUT_DIR="$tmp" cargo test -p dzpos-api --features clinic --test export_bindings
          diff -r "$tmp" packages/shared/src/generated

  web:
    if: github.repository == 'samir1498/dz-pos-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dzpos-desktop lint
      - run: pnpm -r build
      - run: pnpm -r test

  windows:
    if: github.repository == 'samir1498/dz-pos-ci' && (github.ref == 'refs/heads/main' || inputs.windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dzpos-desktop build
      - run: cargo test --workspace

  coverage:
    if: github.repository == 'samir1498/dz-pos-ci' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev
          libgtk-3-dev
          libxcb1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libssl-dev
          patchelf
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: CARGO_TARGET_DIR=/tmp/llvm-cov-target cargo llvm-cov -p dzpos-core -p dzpos-api --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: rust-lcov
          path: lcov.info
