name: Release

# A tag matching the release shape (v<semver>) on main is the only thing
# that publishes a GitHub release (M5 T6, docs/architecture.md § Release).
# A manual dispatch never publishes: it exists to exercise the same build
# machinery before the first real tag, and uploads the installer as a run
# artifact instead. The `gate` job below decides which of the two this run
# is and says so in its own output; `.github/scripts/release-gate.sh` holds
# the actual decision logic and can be run and proven off this file.
#
# Windows minutes are the same capped organisation budget, so releases are
# cut from the public mirror, not the org: push the tag to both remotes
# (`just release vX.Y.Z`), the mirror spends Samir's free minutes building
# all three installers, and the publish job creates the release on
# Dinar-dz/dz-pos by API call (no minutes). A tag on Dinar-dz alone starts
# no runner until the budget is restored. A dry run without a tag:
#   gh workflow run Release --repo samir1498/dz-pos-ci --ref <branch-or-tag>
# See the PR description for what is proven here and what is not.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides release vs. dry-run and refuses anything that is neither. Every
  # later job depends on this one, so a refusal here (non-zero exit) stops
  # the build and the publish from running at all.
  gate:
    # The header above says a tag on Dinar-dz starts no runner. Nothing
    # enforced that: `ci.yml` guards every job on the mirror, this file
    # guarded none, so `just release` — which pushes the tag to both
    # remotes — ran the whole three-OS build on the org's paid minutes as
    # well as on the mirror's free ones, macOS at ten times the Linux rate.
    # Found 2026-09-16. `build` and `publish` need this job, so a skip here
    # skips them too; they carry the same guard so the reason is readable
    # from either one.
    if: github.repository == 'samir1498/dz-pos-ci'
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      updater: ${{ steps.gate.outputs.updater }}
      # Whether TAURI_SIGNING_PRIVATE_KEY exists at all, independent of
      # `updater` above: `updater` also folds in "is this a real release",
      # which is the wrong question for the Windows build job -- a dry run
      # with the key configured still needs `tauri build` to actually sign
      # the updater payload (proving the cert and the key both work before
      # the first tag needs them to), it just must not publish a manifest.
      updater_key: ${{ steps.updaterkey.outputs.present }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Only meaningful for a tag push. `github.sha` is reliable for an
      # annotated or lightweight tag alike because we dereference the ref
      # ourselves with `^{commit}` rather than trust the event payload.
      #
      # REF goes through `env:` rather than being pasted into the script
      # text: a tag name is allowed to contain `$`, a backtick, `"`, `;`
      # and parentheses, and Actions substitutes `${{ github.ref }}` into
      # this `run:` block before bash ever parses it. A tag crafted with
      # those characters would run as shell commands inside this job,
      # which could then write anything it likes to $GITHUB_OUTPUT,
      # including a forged `on_main=true`. Binding through `env:` and
      # reading `$REF` hands bash a plain string instead of script text.
      - name: Is the tagged commit on main
        id: onmain
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref }}
        run: |
          git fetch origin main --quiet
          sha="$(git rev-parse "$REF^{commit}")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$sha" origin/main; then
            echo "on_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "on_main=false" >> "$GITHUB_OUTPUT"
          fi

      # Whether the updater signing key exists, read here rather than left
      # to the gate script: a secret is only visible to a step that names
      # it, and the point of asking now is that the answer is a plain
      # `true`/`false` the script can take as an argument the same way it
      # already takes ON_MAIN, never the secret's value itself.
      - name: Is the updater signing key configured
        id: updaterkey
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # Same reasoning as the step above: REF is the tag name on a push and
      # is not trusted text, so both it and EVENT_NAME go through `env:`
      # and reach the gate script as argv, never spliced into the `run:`
      # text. The script only ever sees them as plain argv strings; the
      # vulnerable point was always this YAML boundary, one layer above
      # the script, which is why a test that only calls the script
      # directly cannot see this class of bug.
      - name: Gate
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ steps.onmain.outputs.sha || github.sha }}
          ON_MAIN: ${{ steps.onmain.outputs.on_main }}
          UPDATER_KEY_PRESENT: ${{ steps.updaterkey.outputs.present }}
        run: |
          .github/scripts/release-gate.sh \
            "$EVENT_NAME" \
            "$REF" \
            "$SHA" \
            "$ON_MAIN" \
            "Cargo.toml" \
            "apps/desktop/src-tauri/tauri.conf.json" \
            "$UPDATER_KEY_PRESENT"

      - name: Say the decision out loud
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          VERSION: ${{ steps.gate.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "### Release gate"
            echo
            echo "mode: \`$MODE\`"
            echo "version: \`$VERSION\`"
            if [ "$MODE" = "dry-run" ]; then
              echo
              echo "This is a manual dry run. It builds all three installers"
              echo "(Windows, macOS, Linux) and uploads them as run artifacts."
              echo "**No release is created and no tag is touched.**"
            else
              echo
              echo "This is a real release, cut from \`$REF_NAME\` on main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Builds all three installers (Windows nsis, macOS dmg, Linux appimage).
  # Runs for both a release and a dry run: the whole point of the dry run is
  # to prove this job works before the first real tag needs it to. It never
  # has `contents: write`, so nothing in this job can publish anything by
  # itself.
  build:
    needs: gate
    if: github.repository == 'samir1498/dz-pos-ci'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            bundle_dir: nsis
            bundle_glob: "*.exe"
            artifact_os: windows
            stable_name: Dinar-Setup.exe
          - os: macos-latest
            bundle: dmg
            bundle_dir: dmg
            bundle_glob: "*.dmg"
            artifact_os: macos
            stable_name: Dinar.dmg
          - os: ubuntu-latest
            bundle: appimage
            bundle_dir: appimage
            bundle_glob: "*.AppImage"
            artifact_os: linux
            stable_name: Dinar.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      # Type-checks `packages/shared` (its build script is `tsc --noEmit`)
      # before `tauri build` runs `apps/desktop`'s own build through
      # `beforeBuildCommand`; a broken shared type would rather fail here
      # than inside the bundler.
      - run: pnpm -r build

      # Tauri links webkit on Linux; the Windows and macOS runners already
      # carry what they need.
      - name: Install Linux web dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Windows code-signing certificate. Not the Tauri updater key (T7):
      # this signs the .exe itself so Windows SmartScreen does not flag it.
      # No certificate exists yet (docs/architecture.md § Release, open
      # question), so this branch is written but unexercised here.
      - name: Is a Windows code-signing certificate configured
        id: cert
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no WINDOWS_CERTIFICATE secret; building an unsigned installer"
          fi

      # Secrets go through env vars, never interpolated into the script text
      # itself: a `$`, `"` or backtick in the password would otherwise land
      # in the middle of PowerShell source rather than being read as data.
      - name: Import the code-signing certificate
        if: matrix.os == 'windows-latest' && steps.cert.outputs.present == 'true'
        id: import
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $path = Join-Path $env:RUNNER_TEMP "dz-pos-signing.pfx"
          [IO.File]::WriteAllBytes($path, $bytes)
          $securePw = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $securePw
          Remove-Item $path
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      # `TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]` is a second, independent key
      # from the Windows certificate above: this one signs the update
      # payload the plugin verifies against `tauri.conf.json`'s `pubkey`,
      # not the installer's Authenticode signature. `createUpdaterArtifacts`
      # in `tauri.conf.json` only asks for the `.sig` sidecar, but a `pubkey`
      # being configured at all is what makes `tauri build` require a
      # private key for *any* nsis/msi/appimage/deb/rpm target (tauri-cli's
      # `sign_updaters`, independent of `createUpdaterArtifacts`), so a build
      # with no updater key needs `--no-sign` or it fails outright the
      # moment `pubkey` is set, key or not -- this is what the unsigned step
      # below does. Both steps key off `updater_key` (is the secret present
      # at all), never off `updater` (is this run allowed to *publish* a
      # manifest): a manual dry run with both secrets configured is exactly
      # where signing both the installer and the update payload should be
      # proven before the first real tag needs them to work, and the
      # manifest step further down stays the only place gated on
      # `updater == 'publish'`, so nothing from a dry run is ever attached
      # to a release. `--no-sign` is not safe to reach for in the signed
      # step: its own help text and tauri-cli's own log line ("Skipping
      # binary signing due to --no-sign flag") say it skips Authenticode
      # signing too, not only the updater sidecar, so silently adding it
      # here would import a real certificate, then ship an unsigned .exe
      # while the publish job (reading `has_cert`, not whether anything was
      # actually signed) still called the release "Windows installer,
      # signed." The two keys are not independent in practice: a
      # certificate cannot be used here until the updater key exists too,
      # so this stops loudly instead, until whoever holds them lands both
      # (docs/architecture.md § Release; docs/release-checklist.md, "the
      # key that signs updates").
      - name: Build the installer (signed Windows)
        if: matrix.os == 'windows-latest' && steps.cert.outputs.present == 'true'
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_KEY: ${{ needs.gate.outputs.updater_key }}
          THUMBPRINT: ${{ steps.import.outputs.thumbprint }}
        run: |
          set -euo pipefail
          if [ "$UPDATER_KEY" != "true" ]; then
            echo "::error::a Windows certificate is configured but no updater signing key is; with plugins.updater.pubkey set, tauri build cannot Authenticode-sign without also being asked to sign the update payload, and --no-sign would silently skip both. Configure TAURI_SIGNING_PRIVATE_KEY (and its password) before this path can ship a signed installer."
            exit 1
          fi
          pnpm exec tauri build --bundles nsis --config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}"

      # macOS and Linux have no signing secrets yet (no Apple Developer
      # account, nothing to sign an AppImage with), so they always take
      # this path; Windows takes it only while there is no certificate.
      # BUNDLE comes from the matrix (nsis/dmg/appimage).
      - name: Build the installer (unsigned)
        if: matrix.os != 'windows-latest' || steps.cert.outputs.present != 'true'
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_KEY: ${{ needs.gate.outputs.updater_key }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          extra=()
          [ "$UPDATER_KEY" = "true" ] || extra+=(--no-sign)
          pnpm exec tauri build --bundles "$BUNDLE" "${extra[@]}"

      # The bundler names files with version and arch
      # (`Dinar_0.1.0_x64-setup.exe`); the landing page and the updater
      # manifest link stable names instead, so the installer is renamed
      # here, once, and everything downstream only ever sees the stable
      # one. The version still lives in the tag that triggered this run.
      - name: Find the installer
        id: find
        shell: bash
        env:
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          BUNDLE_GLOB: ${{ matrix.bundle_glob }}
          STABLE_NAME: ${{ matrix.stable_name }}
        run: |
          installer="$(find "target/release/bundle/$BUNDLE_DIR" -maxdepth 1 -name "$BUNDLE_GLOB" 2>/dev/null | head -n1)"
          if [ -z "$installer" ]; then
            echo "::error::no $BUNDLE_GLOB installer found under target/release/bundle/$BUNDLE_DIR"
            exit 1
          fi
          stable="$(dirname "$installer")/$STABLE_NAME"
          mv "$installer" "$stable"
          if [ -f "$installer.sig" ]; then
            mv "$installer.sig" "$stable.sig"
          fi
          echo "path=$stable" >> "$GITHUB_OUTPUT"

      # The installer plus its updater sidecar when one was produced (only
      # with the updater key configured; `--no-sign` writes no `.sig`, and
      # that is fine). `if-no-files-found` only fires when nothing at all
      # matches, so a missing sidecar does not fail the upload.
      - uses: actions/upload-artifact@v4
        with:
          name: dz-pos-installer-${{ matrix.artifact_os }}-${{ needs.gate.outputs.mode }}-${{ needs.gate.outputs.version }}
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.path }}.sig
          if-no-files-found: error

  # Only this job can touch a GitHub release. It runs only for a push of a
  # release-shaped tag on main that the gate job accepted; a manual dispatch
  # cannot reach it no matter what ref it is pointed at, because it never
  # sets mode to "release". That is the whole back-door answer: there is no
  # input, no branch name and no token in the dry-run path that flips it to
  # publish.
  #
  # The release itself is created on Dinar-dz/dz-pos, not on whichever repo
  # runs this workflow: the organisation's minutes are capped, so tags are
  # pushed to the public mirror and the minutes are spent there, while the
  # release (and its download URLs, which the updater manifest and the
  # landing page both read) lives on the org repo. Creating a release is an
  # API call, not a runner, so it costs no minutes; it does need a token
  # with somewhere to come from, which is ORG_RELEASE_TOKEN (stored as a
  # secret on the mirror; today Samir's own login token, which has push on
  # the org repo -- broader than it needs to be, replace with a
  # fine-grained PAT limited to Dinar-dz/dz-pos when convenient). A private
  # repo's releases are private downloads -- that is
  # a GitHub rule, not this file's -- so these stay draft/collaborators-only
  # until the code-signing certificate lands and the shop's first public
  # build goes out.
  publish:
    needs: [gate, build]
    if: >
      github.repository == 'samir1498/dz-pos-ci' &&
      github.event_name == 'push' &&
      needs.gate.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The release is created on Dinar-dz/dz-pos by API call, so this job
      # writes nothing to the repo running it and needs no write permission
      # there. It does need a token the org accepts, which is
      # ORG_RELEASE_TOKEN. Fail here, loudly, rather than after the
      # manifest is assembled.
      - name: Is the org release token configured
        env:
          ORG_RELEASE_TOKEN: ${{ secrets.ORG_RELEASE_TOKEN }}
        run: |
          [ -n "$ORG_RELEASE_TOKEN" ] || { echo "::error::no ORG_RELEASE_TOKEN secret on this repo; it is a fine-grained PAT with contents read+write on Dinar-dz/dz-pos. Nothing can be published without it."; exit 1; }

      # Windows signing state, read the same way the build job reads it: a
      # secret is only visible to a step that names it, and this job only
      # needs the boolean for the release notes below.
      - name: Is a Windows code-signing certificate configured
        id: cert
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: dz-pos-installer-*-release-${{ needs.gate.outputs.version }}
          path: dist
          merge-multiple: false

      # `tauri build` writes each installer and its `.sig` sidecar but never
      # a combined manifest, so this assembles `latest.json` by hand across
      # the three platforms. `size` is not part of the plugin's own manifest
      # shape at all -- the About screen's "what it weighs" only exists
      # because this step adds it, and reads it back off `raw_json`
      # (`src-tauri/src/updater.rs`). macOS runners are Apple Silicon, hence
      # darwin-aarch64. Unexercised against a real key: updater=publish only
      # happens on a real release with the signing key, and there has been
      # no such release yet (docs/release-checklist.md, "what no gate can
      # cover").
      - name: Assemble the updater manifest
        id: manifest
        if: needs.gate.outputs.updater == 'publish'
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<"PY"
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          tag = os.environ["TAG"]
          version = os.environ["VERSION"]
          base = f"https://github.com/Dinar-dz/dz-pos/releases/download/{tag}"
          ext_platform = {".exe": "windows-x86_64", ".dmg": "darwin-aarch64", ".AppImage": "linux-x86_64"}
          platforms = {}
          installers = sorted(
              p for p in Path("dist").rglob("*") if p.is_file() and p.suffix in ext_platform
          )
          if not installers:
              raise SystemExit("::error::no installers under dist/")
          for path in installers:
              sig = path.with_name(path.name + ".sig")
              if not sig.is_file():
                  raise SystemExit(f"::error::updater=publish but '{sig}' was not produced")
              platforms[ext_platform[path.suffix]] = {
                  "url": f"{base}/{path.name}",
                  "signature": sig.read_text().strip(),
                  "size": path.stat().st_size,
              }
          manifest = {
              "version": version,
              "notes": "See the GitHub release.",
              "pub_date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          Path("dist/latest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"manifest covers: {', '.join(sorted(platforms))}")
          PY

      - name: Publish the GitHub release on the org repo
        env:
          GH_TOKEN: ${{ secrets.ORG_RELEASE_TOKEN }}
          VERSION: ${{ needs.gate.outputs.version }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          HAS_CERT: ${{ steps.cert.outputs.present }}
          UPDATER: ${{ needs.gate.outputs.updater }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) | sort)
          [ "${#assets[@]}" -eq 3 ] || { echo "::error::expected 3 installers under dist/, found ${#assets[@]}"; exit 1; }

          if [ "$UPDATER" = "publish" ]; then
            [ -f dist/latest.json ] || { echo "::error::updater=publish but dist/latest.json was not assembled"; exit 1; }
            assets+=("dist/latest.json")
            updater_note=""
          else
            updater_note=$'\n\n'"No updater signing key is configured yet: this release carries no update manifest, so an existing install will not discover it on its own (docs/architecture.md § Release)."
          fi

          flags=(--title "Dinar $VERSION" --repo Dinar-dz/dz-pos)
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)

          notes="Dinar $VERSION installers:"
          for asset in "${assets[@]}"; do
            case "$asset" in
              *.exe)
                if [ "$HAS_CERT" = "true" ]; then
                  notes+=$'\n- Windows (.exe): signed installer.'
                else
                  notes+=$'\n- Windows (.exe): **unsigned**; SmartScreen will warn on install.'
                fi
                ;;
              *.dmg) notes+=$'\n- macOS (.dmg): **unsigned**; right-click, Open on first launch (no Apple Developer signing yet).' ;;
              *.AppImage) notes+=$'\n- Linux (.AppImage): make executable, then run.' ;;
            esac
          done
          if [ "$HAS_CERT" = "true" ]; then
            :
          else
            flags+=(--draft)
            notes+=$'\n\n'"No Windows code-signing certificate is configured yet: published as a draft on purpose; review before making it public."
            echo "::warning::publishing an unsigned release as a draft, not a public one"
          fi
          notes="$notes$updater_note"

          gh release create "$TAG" "${assets[@]}" "${flags[@]}" --notes "$notes"
