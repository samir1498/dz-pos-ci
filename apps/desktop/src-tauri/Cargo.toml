[package]
name = "dzpos-desktop"
version.workspace = true
edition.workspace = true
default-run = "dzpos-desktop"

[dependencies]
dzpos-core = { path = "../../../crates/core" }
dzpos-api = { path = "../../../crates/api" }
axum = "0.8.9"
serde = { workspace = true, features = ["derive"] }
dirs = "6.0"
tauri = { version = "2", features = ["devtools"] }
# 2.4.4 is the current release, checked on crates.io 2026-09-08. A second
# launch must focus the window that is already open: two processes on one
# SQLite file is how a till loses a sale.
tauri-plugin-single-instance = "2.4.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
