[package]
name = "dzpos-desktop"
version.workspace = true
edition.workspace = true
default-run = "dzpos-desktop"

[features]
# Whole-loop review, 2026-09-24 (T2): a `VITE_DINAR_MODULES=clinic` build's
# screens hit 404s, because this crate's own Cargo.toml named neither
# `dzpos-api` nor `dzpos-core`'s features and took each one's `retail`
# default no matter what the frontend carried. `default-features = false`
# on both below is what makes `retail` here an actual switch and not a
# false floor under `--no-default-features --features clinic`
# (`apps/desktop/scripts/tauri.mjs`, `modules.config.mjs::cargoFeatureArgs`)
default = ["retail"]
retail = ["dzpos-api/retail", "dzpos-core/retail"]
clinic = ["dzpos-api/clinic", "dzpos-core/clinic"]

[dependencies]
dzpos-core = { path = "../../../crates/core", default-features = false }
dzpos-api = { path = "../../../crates/api", default-features = false }
axum = "0.8.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
dirs = "6.0"
tauri = { version = "2", features = ["devtools"] }
# 2.4.4 is the current release, checked on crates.io 2026-09-08. A second
# launch must focus the window that is already open: two processes on one
# SQLite file is how a till loses a sale.
tauri-plugin-single-instance = "2.4.4"
# 2.11.0, checked on crates.io 2026-09-12, the same day this was added.
# `src/updater.rs` wraps its `check`/`download_and_install` in two commands
# of our own rather than exposing the plugin's own IPC commands to the
# webview, so no `updater:*` permission is added to `capabilities/`: the
# only door the page gets is `check_for_update` and `install_update`,
# gated like every other command by `core:default` (docs/architecture.md
# § Release).
tauri-plugin-updater = "2.11.0"

# Only for the startup-failure message box (src/startup_failure.rs): the
# window never opens on a release build (no console either, see main.rs),
# so a shopkeeper sees nothing unless something native tells them. 0.61 is
# already in Cargo.lock transitively; rfd would be the ready-made crate
# for this but pulls in GTK or the xdg portal on Linux, a cost this
# failure never needs to pay since it is Windows-only by construction.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# `tauri::test` (mock_builder, asset_resolver) so the CSP test can read the
# policy off the served page instead of the config file. Cargo unifies this
# with the plain `tauri` dependency above for any build that includes tests.
#
# `custom-protocol` too, on purpose: it is what `tauri::is_dev()` is (`!cfg!
# (feature = "custom-protocol")`), and it also gates a second thing that
# matters more here -- `AssetResolver` reads `dist/index.html` straight off
# disk with no CSP at all whenever `devUrl` is configured and `is_dev()` is
# true, which describes every plain `cargo run`/`cargo test` in this repo
# otherwise (`tauri.conf.json` always sets `devUrl`). Only the Tauri CLI's
# own `build`/`bundle` step turns this feature on for the shipped binary;
# turning it on here is what lets `cargo test` (`just test`) exercise the
# same asset-embedding, CSP-injecting path that binary runs, instead of the
# disk-read shortcut. It is a dev-dependency only, so a plain `cargo run`
# is unaffected and still gets the live Vite dev server.
tauri = { version = "2", features = ["test", "custom-protocol"] }
minisign-verify = "0.2"

[lints]
workspace = true
