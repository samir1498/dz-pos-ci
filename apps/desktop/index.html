<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Synchronous, blocking, and first in <head>, so it runs before the
      // rest of the document parses and well before main.tsx (a deferred
      // module script) can mount React. Without it, a return visitor who
      // chose Arabic saw a flash of this LTR/fr fallback on every load:
      // I18nProvider's effect (src/i18n/index.tsx) only sets these
      // attributes once React has mounted, which is too late for first
      // paint. Same guard as `initialLang` there: only fr/en/ar count.
      (function () {
        try {
          var saved = window.localStorage.getItem("dzpos-lang");
          var lang = saved === "en" || saved === "ar" ? saved : "fr";
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        } catch (e) {
          // Storage blocked (private mode, some embeds): the fr/ltr
          // already on <html> above stays.
        }
      })();
      // Same trick for the theme, and the same reason: ThemeProvider only
      // knows the shop's choice once the API has answered, which is long
      // after first paint, so a shop on Registre saw a white flash on every
      // load. The provider mirrors the resolved name here on its way past.
      // With nothing stored (a fresh machine) the machine's own preference
      // picks between the two OS themes, which is what the provider does too.
      (function () {
        var names = ["comptoir", "registre", "observe", "observe-dark"];
        var theme = null;
        try {
          theme = window.localStorage.getItem("dzpos-theme");
        } catch (e) {
          // storage blocked; fall through to the media query
        }
        if (names.indexOf(theme) === -1) {
          theme =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "registre"
              : "comptoir";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <!-- No font link. The three families come in as packages (the
         @fontsource ones) and are imported at the top of src/styles.css, so
         the woff2 files ship in the bundle: a shop counter has no internet,
         and a face fetched from a CDN would look right on the machine that
         built it and fall back to system-ui on the one that matters. -->
    <!-- The 24 px variant of the mark, straight out of the design package
         rather than copied into a public/ folder, so there is one drawing.
         Vite rewrites this path at build time. -->
    <link rel="icon" type="image/svg+xml" href="../../packages/design/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dz-pos</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
