# Maestro flow (M7 T6): paired phone proven on a real phone over Tailscale.
# Run: `maestro test apps/mobile/maestro/pair-and-sell.yaml`
# Pre: desktop in LAN mode (`just api` with bind_lan + mDNS), owner shows QR
# (`POST /pairing/qr` with EditSettings session), phone on same Tailscale
# (`100.111.55.62` is the laptop, `192.168.0.134` is the shop LAN in the
# example — use the desktop's mDNS `Dinar-*.local` or its Tailscale IP).
# This flow drives the Expo dev client (`com.dinar.app` dev) via Metro at
# `exp://192.168.0.134:8081` — scan the QR Metro prints, or run `maestro`
# with `--device` for a connected Android via ADB.
#
# Two things this flow cannot do, so do not read more into a green run than
# is there. It reads labels on a screen, never a row in the shop file: only
# the desktop's own documents list proves a sale rang once rather than
# twice. And steps marked HUMAN need someone at the desktop — Maestro
# cannot revoke a device or mint a QR by itself.
#
# Repaired 2026-09-16 after the adversarial review found this flow could not
# run as written: it tapped a "Retry queued" button that the Till unmounts
# the moment the queue empties, and its revoke step was a comment rather
# than a step, so nothing after it meant anything.
#
# Relabelled 2026-09-16 for the expo-router rewrite: the screens are the same
# three, but every string this flow taps moved into the design system.

appId: com.dinar.app
name: Pair, sign in, sell, offline retry is one sale, revoke is 401
tags:
  - m7
  - idempotency
  - device

---

# 1 — Pair this phone (no session yet, only the code the desktop shows).
# The screen opens on the camera, which Maestro cannot point at a monitor, so
# the flow takes the typed path the screen keeps for a dead lens or a refused
# permission. Both post the same `/pairing/claim`.
# HUMAN: mint the QR now (`POST /pairing/qr` as owner) — it lives 60 seconds,
# so do it when this screen is already up, and paste the 64-hex below.
- launchApp:
    clearState: true
- assertVisible: "Pair this phone"
- tapOn: "Type the code instead"
- tapOn: "Code from the QR"
- inputText: "PAIRING_TOKEN_FROM_DESKTOP_QR"
- tapOn: "Name for this phone"
- inputText: "Maestro phone"
- tapOn: "Pair"
- assertVisible: "Sign in on this phone"

# 2 — Sign in as a person (device-gated login, M7 T3). Use a cashier PIN
# the owner just set in settings (e.g. `2580` for user id `2`).
- tapOn: "Your number"
- inputText: "2"
- tapOn: "PIN"
- inputText: "2580"
- tapOn: "Sign in"
# The till's own resting state: nothing queued, nothing in the basket. The
# cashier's name is on this screen too, but it comes from the shop file and
# would pin this flow to one seed.
- assertVisible: "Basket empty"

# 3 — Online sale rings once and prints through the desktop. The till prices
# the basket the way the core does, so what it asks for is TTC plus the
# stamp, not the sum of the price tags. "Exact" fills the box with that
# amount; the change shown afterwards is the server's answer, not the
# phone's arithmetic.
- tapOn: "Add .*" # first product in the list
- assertVisible: "1 item"
- tapOn: "Exact"
- tapOn: "Pay cash"
- assertVisible: "Change:.*"
- assertVisible: "Basket empty"
# HUMAN: the desktop's documents list must show exactly one new ticket, and
# a ticket must have come out of the spool. Neither is visible from here.

# 4 — Offline: the sale is queued, and only because the call got no answer.
- toggleAirplaneMode
- tapOn: "Add .*"
- tapOn: "Exact"
- tapOn: "Pay cash"
- assertVisible: "1 sale waiting to be sent"
- assertVisible: "Send now"

# 5 — Back online, the retry rings once and prints. The row disappears with
# the queue it drains, so there is no second tap to make here: the proof
# that a replay does not re-ring is the desktop's documents list, which must
# still show one ticket for this basket, not two.
- toggleAirplaneMode
- tapOn: "Send now"
- assertNotVisible: "Send now"
# HUMAN: desktop documents list — one new ticket for step 4's basket.

# 6 — Revoke mid-shift. HUMAN: on the desktop, settings → paired phones →
# revoke this one (or `POST /pairing/devices/{id}/revoke` with an owner
# session). Then continue: the phone's next call fails closed, and because
# a revoked device is a refusal and not a dropped connection, the till sends
# the cashier back to pairing instead of queueing a sale nobody can deliver.
- tapOn: "Add .*"
- tapOn: "Exact"
- tapOn: "Pay cash"
- assertVisible: "Pair this phone"
- assertVisible: "no longer paired|not paired"

# 7 — Sign out ends the server session, not just the local copy. Reached by
# re-pairing and signing in again after step 6; kept here as the last thing
# to check by hand rather than pretending the flow can get back to it.
# HUMAN: re-pair, sign in, tap "Sign out", expect "Pair this phone" and the
# desktop's session list to show the session ended.
