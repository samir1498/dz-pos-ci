[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
diesel = "2.2"
chrono = "0.4"
serde = "1.0"
serde_json = "1.0"

# Panics on a shop's till are data loss; every fallible path returns an error.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
