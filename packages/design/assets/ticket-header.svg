<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="18" height="18" role="img" aria-label="Dinar POS">
  <!-- Pure black, no fill, for the 80 mm roll and the A4 footer. A thermal
       head prints one colour and no halftone, so the coin is an outline and
       the stroke is heavy enough to survive a worn roll. The shop's own name
       leads on the ticket; this is the stamp beside it. -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#000000" stroke-width="7"/>
  <path d="M40 26 A 26 26 0 0 1 40 74" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <path d="M40 74 L 28 74" fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
</svg>
